x-common-envs: &common-envs
 FILETRACKER_URL: 'http://s3dedup:9999/ft'
 DATABASE_HOST: 'db'
 DATABASE_PORT: '5432'
 OIOIOI_TIMEZONE: '${OIOIOI_TIMEZONE:-Europe/Warsaw}'

# Fixed dev credentials shared by garage-init and s3dedup.
# Garage requires access key IDs of the form GK + 24 hex digits.
x-s3-envs: &s3-envs
  BUCKET_NAME: oioioi-filetracker
  S3_ACCESS_KEY: GK0123456789abcdef01234567
  S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

services:
  db:
    image: library/postgres:14.17
    environment:
      POSTGRES_USER: "oioioi"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "oioioi"
    volumes:
      - postgress-data-dev:/var/lib/postgresql/data
    stop_grace_period: 1m
  web:
    image: sio2project/oioioi-dev
    command: ["/sio2/oioioi/oioioi_init.sh", "--dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        - "oioioi_uid=${OIOIOI_UID}"
      extra_hosts:
        - "web:127.0.0.1"
    environment:
      OIOIOI_DB_ENGINE: 'django.db.backends.postgresql'
      RABBITMQ_HOST: 'broker'
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: 'oioioi'
      RABBITMQ_PASSWORD: 'oioioi'
      FILETRACKER_SERVER_ENABLED: 'False'
      <<: *common-envs
    ports:
    # web server
      - "8000:8000"
    # notifications server
    # - "7887:7887"
    volumes:
      - .:/sio2/oioioi
      # use docker's node_modules and dist_webpack instead of the host ones
      - node_modules-dev:/sio2/oioioi/node_modules
      - dist_webpack-dev:/sio2/oioioi/dist_webpack
      - filetracker-data-dev:/sio2/deployment/media
#      - ./deployment:/sio2/deployment
    stop_grace_period: 3m
    # Healthy once oioioi_init.sh has built assets and applied migrations.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/oioioi_init_done"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15m
    depends_on:
      - db
      - broker
      - s3dedup
  worker:
    image: sio2project/oioioi-dev
    command: ["/sio2/oioioi/worker_init.sh"]
    environment:
      WEB_URL: "web:8000"
      <<: *common-envs
    volumes:
      - .:/sio2/oioioi
    stop_grace_period: 1m
    cap_add:
      - ALL
    depends_on:
      - db
  broker:
    image: library/rabbitmq:3.8
    environment:
      RABBITMQ_DEFAULT_USER: oioioi
      RABBITMQ_DEFAULT_PASS: oioioi
    stop_grace_period: 1m
  garage:
    image: dxflrs/garage:v2.2.0
    volumes:
      - ./extra/docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta-dev:/var/lib/garage/meta
      - garage-data-dev:/var/lib/garage/data
    # S3 API, uncomment to inspect the bucket from the host
    # ports:
    #   - "3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 1m
  # One-shot: assigns the cluster layout, imports the S3 key and creates the bucket.
  # Reuses the s3dedup image only because it ships sh and curl.
  garage-init:
    image: &s3dedup-image ghcr.io/sio2project/s3dedup:1.3.2
    entrypoint: ["/bin/sh", "/init-garage.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: oioioi-dev-admin-token
      <<: *s3-envs
    volumes:
      - ./extra/docker/garage/init-garage.sh:/init-garage.sh:ro
    healthcheck:
      disable: true
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
  s3dedup:
    image: *s3dedup-image
    ports:
      - "9999:9999"
    environment:
      LOG_LEVEL: debug
      LISTEN_ADDRESS: 0.0.0.0
      LISTEN_PORT: 9999
      KVSTORAGE_TYPE: sqlite
      SQLITE_PATH: /app/data/kv.db
      SQLITE_MAX_CONNECTIONS: 10
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_FORCE_PATH_STYLE: "true"
      CLEANER_ENABLED: "true"
      CLEANER_INTERVAL: 3600
      CLEANER_BATCH_SIZE: 1000
      CLEANER_MAX_DELETES: 10000
      <<: *s3-envs
    volumes:
      - s3dedup-data-dev:/app/data
    depends_on:
      garage-init:
        condition: service_completed_successfully
    # The image's built-in healthcheck probes port 8080, but we set LISTEN_PORT=9999,
    # so it has to be overridden to check the port the server actually listens on.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: on-failure:5
    stop_grace_period: 1m
volumes:
  postgress-data-dev:
  filetracker-data-dev:
  node_modules-dev:
  dist_webpack-dev:
  garage-meta-dev:
  garage-data-dev:
  s3dedup-data-dev:
